name: Literature alerts

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      papers:
        description: "How many waiting papers to classify"
        required: false
        default: "200"
      since:
        description: "Optional: read OpenAlex back to this date first (YYYY-MM-DD)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.8.14
        with:
          cache: true
      - name: Fetch and classify
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          PAPERS: ${{ inputs.papers }}
          SINCE: ${{ inputs.since }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$SINCE" ]; then
              pixi run python -m literature backfill --papers "$PAPERS" --since "$SINCE"
            else
              pixi run python -m literature backfill --papers "$PAPERS"
            fi
          else
            pixi run literature
          fi
      - name: Commit the library and the page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add literature/web/papers.js literature/data/literature.sqlite
          if git diff --cached --quiet; then
            echo "No literature changes to commit."
            exit 0
          fi
          git commit -m "Update the literature library."
          git push
