<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Deux portes vers la matrice mitochondriale</title>
  <desc id="desc">Le pyruvate entre par le transporteur du pyruvate et la pyruvate déshydrogénase. Les acides gras longs passent par la navette de la carnitine. Les deux deviennent de l'acétyl-CoA. Un excès d'acétyl-CoA piège la carnitine libre.</desc>
  <rect width="980" height="560" rx="18" fill="#f7f4ee" />
  <text x="36" y="42" fill="#1e2930" font-family="Palatino, Georgia, serif" font-size="26">Deux portes vers la matrice</text>
  <text x="36" y="68" fill="#5c6b73" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Glucides et lipides visent le même acétyl-CoA, et la carnitine libre.</text>

  
  <rect x="28" y="96" width="300" height="420" rx="12" fill="#efe6d6" />
  <rect x="328" y="96" width="70" height="420" fill="#1f6f6a" />
  <rect x="398" y="96" width="554" height="420" rx="12" fill="#fffdf8" stroke="#e4ddd0" />
  <text x="48" y="122" fill="#8a7560" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">cytosol</text>
  <text x="363" y="122" text-anchor="middle" fill="#f7f4ee" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">membrane</text>
  <text x="363" y="136" text-anchor="middle" fill="#f7f4ee" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">interne</text>
  <text x="420" y="122" fill="#1f6f6a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">matrice</text>

  
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="52" y="168" width="150" height="54" rx="10" fill="#0f766e" />
    <text x="127" y="192" text-anchor="middle" fill="#f7f4ee" font-size="14" font-weight="700">pyruvate</text>
    <text x="127" y="210" text-anchor="middle" fill="#d7ebe7" font-size="11">issu de la glycolyse</text>
    <path d="M202 195 H328" stroke="#0f766e" stroke-width="3" fill="none" />
    <polygon points="328,195 316,189 316,201" fill="#0f766e" />
    <text x="250" y="186" text-anchor="middle" fill="#0f766e" font-size="12">MPC</text>

    <rect x="430" y="160" width="180" height="70" rx="10" fill="#0f766e" />
    <text x="520" y="188" text-anchor="middle" fill="#f7f4ee" font-size="15" font-weight="700">PDH</text>
    <text x="520" y="208" text-anchor="middle" fill="#d7ebe7" font-size="12">ouverte si le Ca2+ est haut</text>
    <text x="520" y="248" text-anchor="middle" fill="#5c6b73" font-size="12">fermée si la PDK la phosphoryle</text>
  </g>

  
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="52" y="330" width="150" height="70" rx="10" fill="#a16207" />
    <text x="127" y="356" text-anchor="middle" fill="#fffdf8" font-size="14" font-weight="700">acyl-CoA gras</text>
    <text x="127" y="376" text-anchor="middle" fill="#f3e6c8" font-size="11">l'activation coûte de l'ATP</text>
    <path d="M202 360 H328" stroke="#a16207" stroke-width="3" fill="none" />
    <polygon points="328,360 316,354 316,366" fill="#a16207" />
    <text x="250" y="348" text-anchor="middle" fill="#a16207" font-size="12">CPT-I</text>
    <text x="127" y="418" text-anchor="middle" fill="#9f1239" font-size="12">exige de la carnitine libre</text>

    <rect x="430" y="320" width="200" height="78" rx="10" fill="#a16207" />
    <text x="530" y="350" text-anchor="middle" fill="#fffdf8" font-size="15" font-weight="700">bêta-oxydation</text>
    <text x="530" y="372" text-anchor="middle" fill="#f3e6c8" font-size="12">2 carbones à la fois</text>
  </g>

  
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <path d="M610 195 H700 V250 H760" stroke="#1e2930" stroke-width="2.5" fill="none" />
    <path d="M630 359 H700 V290 H760" stroke="#1e2930" stroke-width="2.5" fill="none" />
    <polygon points="760,270 748,264 748,276" fill="#1e2930" />
    <rect x="760" y="236" width="170" height="68" rx="12" fill="#1e2930" />
    <text x="845" y="264" text-anchor="middle" fill="#f7f4ee" font-size="16" font-weight="700">acétyl-CoA</text>
    <text x="845" y="284" text-anchor="middle" fill="#d6d3cd" font-size="12">un seul réservoir</text>

    <circle cx="845" cy="400" r="52" fill="none" stroke="#1f6f6a" stroke-width="3" />
    <text x="845" y="396" text-anchor="middle" fill="#1f6f6a" font-size="16" font-weight="700">TCA</text>
    <text x="845" y="414" text-anchor="middle" fill="#5c6b73" font-size="11">NADH, FADH2</text>
    <path d="M845 304 V348" stroke="#1f6f6a" stroke-width="2.5" fill="none" />
    <polygon points="845,348 839,336 851,336" fill="#1f6f6a" />
  </g>

  <text x="48" y="490" fill="#9f1239" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Quand l'acétyl-CoA inonde la matrice, la carnitine est piégée en acétylcarnitine et la porte des graisses se ferme.</text>
</svg>