<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" role="img" aria-labelledby="title desc">
  <title id="title">The creatine shuttle seen from the mitochondrion</title>
  <desc id="desc">ATP made in the matrix is exported, its phosphate is transferred to creatine in the intermembrane space, and phosphocreatine diffuses to the myofibril. Creatine returns.</desc>
  <rect width="980" height="440" rx="18" fill="#f7f4ee"/>
  <text x="36" y="42" fill="#1e2930" font-family="Palatino, Georgia, serif" font-size="26">The shuttle, seen from this side</text>
  <text x="36" y="68" fill="#5c6b73" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Phosphocreatine is the sprint store and the wire that delivers mitochondrial ATP.</text>

  <!-- regions -->
  <rect x="28" y="100" width="250" height="300" rx="12" fill="#fffdf8" stroke="#e4ddd0"/>
  <rect x="278" y="100" width="250" height="300" rx="0" fill="#e5f2f0"/>
  <rect x="528" y="100" width="424" height="300" rx="12" fill="#efe6d6"/>
  <text x="48" y="128" fill="#1f6f6a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">matrix</text>
  <text x="298" y="128" fill="#164e4a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">intermembrane space</text>
  <text x="548" y="128" fill="#8a7560" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">cytosol, toward the myofibril</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <rect x="70" y="180" width="160" height="70" rx="10" fill="#1f6f6a"/>
    <text x="150" y="210" fill="#f7f4ee" font-size="16" font-weight="700">ATP made</text>
    <text x="150" y="230" fill="#d7ebe7" font-size="12">by ATP synthase</text>

    <rect x="310" y="168" width="180" height="56" rx="10" fill="#0f766e"/>
    <text x="400" y="202" fill="#f7f4ee" font-size="15" font-weight="700">ANT exchanges</text>

    <rect x="310" y="250" width="180" height="70" rx="10" fill="#c2410c"/>
    <text x="400" y="280" fill="#fffdf8" font-size="15" font-weight="700">mtCK</text>
    <text x="400" y="300" fill="#fde6d6" font-size="12">ATP + Cr to PCr + ADP</text>
    <path d="M400 224 V246" stroke="#1e2930" stroke-width="2.5" fill="none"/>
    <polygon points="400,248 394,236 406,236" fill="#1e2930"/>

    <rect x="620" y="180" width="250" height="78" rx="10" fill="#b45309"/>
    <text x="745" y="210" fill="#fffdf8" font-size="16" font-weight="700">phosphocreatine</text>
    <text x="745" y="232" fill="#f3e6c8" font-size="12">diffuses to myofibrillar CK</text>

    <rect x="620" y="290" width="250" height="64" rx="10" fill="#1e2930"/>
    <text x="745" y="318" fill="#f7f4ee" font-size="15" font-weight="700">ATP at the cross-bridge</text>
    <text x="745" y="338" fill="#d6d3cd" font-size="12">creatine diffuses back</text>
  </g>

  <path d="M230 215 H310" stroke="#1e2930" stroke-width="2.5" fill="none"/>
  <polygon points="310,215 298,209 298,221" fill="#1e2930"/>
  <path d="M490 285 H560 V219 H620" stroke="#c2410c" stroke-width="2.5" fill="none"/>
  <polygon points="620,219 608,213 608,225" fill="#c2410c"/>
  <path d="M745 258 V290" stroke="#1e2930" stroke-width="2.5" fill="none"/>
  <polygon points="745,290 739,278 751,278" fill="#1e2930"/>
</svg>
