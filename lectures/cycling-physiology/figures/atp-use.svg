<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 680" role="img" aria-labelledby="title desc">
  <title id="title">Where a muscle fibre spends ATP during a contraction</title>
  <desc id="desc">The sodium-potassium pump, SERCA, and the myosin head are the three ATPases of a contraction. A four-step cross-bridge cycle shows why the myosin head needs one ATP each pull.</desc>
  <rect width="980" height="680" rx="18" fill="#f7f4ee"/>
  <text x="32" y="40" fill="#1e2930" font-family="Palatino, Georgia, serif" font-size="26">Where a contraction spends ATP</text>
  <text x="32" y="66" fill="#5c6b73" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">The ions move downhill on their own. ATP is spent putting them back, and pulling on actin.</text>

  <rect x="24" y="88" width="452" height="528" rx="14" fill="#fffdf8" stroke="#e4ddd0"/>
  <text x="44" y="116" fill="#1e2930" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">Three ATPases in the fibre</text>

  <rect x="44" y="132" width="412" height="108" rx="12" fill="#efe6d6"/>
  <text x="60" y="156" fill="#8a7560" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">SARCOLEMMA</text>
  <rect x="60" y="168" width="168" height="30" rx="8" fill="#1f6f6a"/>
  <text x="144" y="188" text-anchor="middle" fill="#f7f4ee" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">Na+/K+ pump</text>
  <text x="60" y="218" fill="#1e2930" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">3 Na+ out, 2 K+ in</text>
  <rect x="340" y="168" width="96" height="30" rx="8" fill="#c2410c"/>
  <text x="388" y="188" text-anchor="middle" fill="#fffdf8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">1 ATP</text>

  <rect x="44" y="252" width="412" height="108" rx="12" fill="#e5f2f0"/>
  <text x="60" y="276" fill="#164e4a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">SARCOPLASMIC RETICULUM</text>
  <rect x="60" y="288" width="110" height="30" rx="8" fill="#0f766e"/>
  <text x="115" y="308" text-anchor="middle" fill="#f7f4ee" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">SERCA</text>
  <text x="60" y="338" fill="#1e2930" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">2 Ca2+ pumped back in</text>
  <rect x="340" y="288" width="96" height="30" rx="8" fill="#c2410c"/>
  <text x="388" y="308" text-anchor="middle" fill="#fffdf8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">1 ATP</text>

  <rect x="44" y="372" width="412" height="216" rx="12" fill="#fffdf8" stroke="#e4ddd0"/>
  <text x="60" y="396" fill="#8a7560" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">MYOFIBRIL</text>
  <text x="60" y="424" fill="#1e2930" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">Myosin head</text>
  <text x="60" y="446" fill="#5c6b73" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">One ATP per pull</text>
  <text x="60" y="464" fill="#5c6b73" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">and release</text>
  <rect x="200" y="404" width="88" height="30" rx="8" fill="#c2410c"/>
  <text x="244" y="424" text-anchor="middle" fill="#fffdf8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">1 ATP</text>

  <g fill="#d9cbb6" stroke="#b7a58c">
    <circle cx="300" cy="500" r="8"/>
    <circle cx="322" cy="500" r="8"/>
    <circle cx="344" cy="500" r="8"/>
    <circle cx="366" cy="500" r="8"/>
    <circle cx="388" cy="500" r="8"/>
    <circle cx="410" cy="500" r="8"/>
    <circle cx="432" cy="500" r="8"/>
  </g>
  <text x="300" y="528" fill="#8a7560" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">actin</text>
  <rect x="300" y="540" width="140" height="10" rx="4" fill="#c2410c"/>
  <path d="M366 540 C366 522 388 512 400 500" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round"/>
  <circle cx="402" cy="498" r="6" fill="#c2410c"/>
  <text x="300" y="568" fill="#c2410c" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">myosin</text>

  <rect x="492" y="88" width="464" height="528" rx="14" fill="#fffdf8" stroke="#e4ddd0"/>
  <text x="512" y="116" fill="#1e2930" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">One myosin head, one ATP</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="512" y="146" width="196" height="148" rx="12" fill="#efe6d6"/>
    <text x="528" y="172" fill="#c2410c" font-size="13" font-weight="700">1 - ATP binds</text>
    <text x="528" y="198" fill="#1e2930" font-size="14">The head lets go</text>
    <text x="528" y="218" fill="#1e2930" font-size="14">of actin.</text>
    <text x="528" y="248" fill="#5c6b73" font-size="12">No ATP, no release.</text>

    <rect x="736" y="146" width="196" height="148" rx="12" fill="#e5f2f0"/>
    <text x="752" y="172" fill="#0f766e" font-size="13" font-weight="700">2 - ATP splits</text>
    <text x="752" y="198" fill="#1e2930" font-size="14">The head cocks.</text>
    <text x="752" y="226" fill="#5c6b73" font-size="12">It still holds</text>
    <text x="752" y="244" fill="#5c6b73" font-size="12">ADP and Pi.</text>

    <rect x="736" y="352" width="196" height="148" rx="12" fill="#efe6d6"/>
    <text x="752" y="378" fill="#c2410c" font-size="13" font-weight="700">3 - Power stroke</text>
    <text x="752" y="404" fill="#1e2930" font-size="14">Binds actin. Pi leaves.</text>
    <text x="752" y="424" fill="#1e2930" font-size="14">The head pulls.</text>

    <rect x="512" y="352" width="196" height="148" rx="12" fill="#e5f2f0"/>
    <text x="528" y="378" fill="#0f766e" font-size="13" font-weight="700">4 - ADP leaves</text>
    <text x="528" y="404" fill="#1e2930" font-size="14">The head stays on</text>
    <text x="528" y="424" fill="#1e2930" font-size="14">actin until the</text>
    <text x="528" y="444" fill="#1e2930" font-size="14">next ATP arrives.</text>
  </g>

  <path d="M708 220 H736" stroke="#1e2930" stroke-width="2" fill="none"/>
  <polygon points="736,220 726,215 726,225" fill="#1e2930"/>
  <path d="M834 294 V352" stroke="#1e2930" stroke-width="2" fill="none"/>
  <polygon points="834,352 829,342 839,342" fill="#1e2930"/>
  <path d="M736 426 H708" stroke="#1e2930" stroke-width="2" fill="none"/>
  <polygon points="708,426 718,421 718,431" fill="#1e2930"/>
  <path d="M610 352 V294" stroke="#1e2930" stroke-width="2" fill="none"/>
  <polygon points="610,294 605,304 615,304" fill="#1e2930"/>

  <text x="512" y="540" fill="#1e2930" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Calcium allows step 3. ATP allows the head to let go.</text>
  <text x="512" y="562" fill="#5c6b73" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">That stuck state, with no ATP, is rigor.</text>

  <text x="32" y="648" fill="#5c6b73" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">The two pumps together are about 20-40% of the ATP used in a contraction. Cross-bridges take the rest.</text>
</svg>
